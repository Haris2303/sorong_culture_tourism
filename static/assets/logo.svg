  <path d="M0 14C0 6.3 6.3 0 14 0h20c7.7 0 14 6.3 14 14v2C36 12 14 14 0 22z" fill="#ffffff" opacity="0.12"/>

  <!-- bulu cendrawasih: lambang budaya & kekayaan alam Papua -->
