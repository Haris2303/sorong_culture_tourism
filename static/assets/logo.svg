    <path d="M30 96 Q38 89 46 96 T62 96 T78 96 T94 96 V104 H30 Z" fill="#136666"/>
  </g>

  <!-- motif segitiga di bagian atas badan -->
  <g fill="#E9B872">
    <path d="M38 33 l4 8 l4 -8 z"/>
    <path d="M46 36 l4 8 l4 -8 z"/>
    <path d="M54 37 l4 8 l4 -8 z"/>
    <path d="M62 37 l4 8 l4 -8 z"/>
    <path d="M70 36 l4 8 l4 -8 z"/>
  </g>

  <!-- alas tifa -->
  <ellipse cx="60" cy="98" rx="22" ry="5" fill="#136666"/>

  <!-- kulit/permukaan tifa -->
