  <path d="M13.5 30.5L33.5 11" stroke="#123a5c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M19 25.5c1.2-3.4 3.6-5.6 7-6.8M23.5 21.2c1.1-3 3.2-5 6.2-6.1" stroke="#123a5c" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" fill="none"/>
  <circle cx="13.5" cy="12" r="3" fill="#fbbf24"/>

  <!-- ombak laut: lambang wisata bahari -->
  <path d="M6 37.5c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 9 0" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M6 43.5c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 9 0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.4" fill="none" stroke-linecap="round"/>
