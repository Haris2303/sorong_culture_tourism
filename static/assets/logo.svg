<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Logo Sorong Raya: tifa dengan gelombang laut">
  <defs>
    <clipPath id="tifa-body">
      <path d="M34 26 C34 44 48 50 48 62 C48 74 38 82 38 98 L82 98 C82 82 72 74 72 62 C72 50 86 44 86 26 Z"/>
    </clipPath>
  </defs>

  <!-- badan tifa -->
  <path d="M34 26 C34 44 48 50 48 62 C48 74 38 82 38 98 L82 98 C82 82 72 74 72 62 C72 50 86 44 86 26 Z" fill="#B5532F"/>

  <!-- gelombang laut (dipotong mengikuti bentuk tifa) -->
