  <ellipse cx="60" cy="26" rx="19" ry="5" fill="none" stroke="#B5532F" stroke-width="1.5" opacity="0.6"/>

  <!-- pegangan tifa -->
  <path d="M48 60 C40 60 38 66 44 68" fill="none" stroke="#5A2A14" stroke-width="2.5" stroke-linecap="round"/>
