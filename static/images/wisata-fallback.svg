<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062F44"/>
      <stop offset="45%" stop-color="#0B4E64"/>
      <stop offset="100%" stop-color="#0E6B7C"/>
    </linearGradient>
    <linearGradient id="wSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E6B7C"/>
      <stop offset="35%" stop-color="#0A4F63"/>
      <stop offset="100%" stop-color="#052F40"/>
    </linearGradient>
    <linearGradient id="wSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A876"/>
      <stop offset="100%" stop-color="#9C7C4E"/>
    </linearGradient>
    <radialGradient id="wGlow" cx="0.22" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wSky)"/>
  <rect width="1600" height="1000" fill="url(#wGlow)"/>

  <!-- tebing karang kanan (Tanjung Batu vibe) -->
  <path d="M1150 1000 L1160 720 L1220 660 L1260 700 L1300 630 L1360 690 L1400 610 L1460 680 L1600 560 L1600 1000 Z"
        fill="#0A3B4E" opacity="0.92"/>
  <path d="M1250 1000 L1260 780 L1310 730 L1350 760 L1400 700 L1460 750 L1600 660 L1600 1000 Z"
        fill="#0D4A5E" opacity="0.85"/>

  <!-- laut -->
  <rect y="640" width="1600" height="360" fill="url(#wSea)"/>

  <!-- gradasi turquoise dekat pantai -->
  <path d="M0 800 C 300 760, 600 820, 900 780 C 1100 756, 1300 800, 1600 770 L1600 1000 L0 1000 Z"
        fill="#2AA6A0" opacity="0.28"/>

  <!-- riak & buih ombak -->
  <g fill="#FFFFFF" opacity="0.14">
    <rect x="40" y="700" width="260" height="4" rx="2"/>
    <rect x="380" y="742" width="320" height="4" rx="2"/>
    <rect x="120" y="800" width="420" height="4" rx="2"/>
    <rect x="700" y="770" width="260" height="4" rx="2"/>
    <rect x="900" y="828" width="380" height="4" rx="2"/>
    <rect x="260" y="866" width="500" height="4" rx="2"/>
  </g>

  <!-- pasir pantai depan -->
  <path d="M0 1000 C 250 900, 550 940, 820 900 C 1080 862, 1350 918, 1600 880 L1600 1000 Z" fill="url(#wSand)"/>

  <!-- perahu kecil -->
  <g transform="translate(300,712)" opacity="0.85">
    <path d="M-40 10 L40 10 L26 26 L-26 26 Z" fill="#12303C"/>
    <rect x="-2" y="-34" width="4" height="44" fill="#12303C"/>
    <path d="M2 -30 L2 4 L34 4 Z" fill="#1B4B5C" opacity="0.9"/>
  </g>

  <!-- burung -->
  <g stroke="#0A2E3B" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M760 180 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M840 220 q10 -10 20 0 q10 -10 20 0"/>
  </g>
</svg>
