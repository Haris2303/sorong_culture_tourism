<div id="chat-widget" class="chat-widget closed">
  <button id="chat-toggle-btn" class="chat-toggle-btn" aria-label="Buka chatbot">
    <i class="fa-solid fa-comment-dots"></i>
  </button>

  <div id="chat-panel" class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-online-dot"></span>
        <div>
          <div class="chat-title">Pemandu Pintar Sorong</div>
          <div class="chat-subtitle">Edukasi & Informasi Terverifikasi</div>
        </div>
      </div>
      <button id="chat-close-btn" class="chat-close-btn" aria-label="Tutup chatbot">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="chat-messages" class="chat-messages">
      <div class="chat-message bot">
        <div class="bubble">Selamat datang. Saya pemandu pintar Sorong Raya, silakan tanyakan seputar budaya Suku Moi atau destinasi wisata Kota/Kabupaten Sorong.</div>
      </div>
    </div>

    <div class="chat-quick-replies" id="chat-quick-replies">
      <button type="button" class="chip chip--budaya" data-prompt="Ceritakan tentang budaya Suku Moi">
        <i class="fa-solid fa-feather"></i>Budaya Suku Moi
      </button>
      <button type="button" class="chip chip--wisata" data-prompt="Rekomendasi wisata pantai di Sorong">
        <i class="fa-solid fa-umbrella-beach"></i>Wisata Pantai
      </button>
    </div>

    <form id="chat-form" class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Tulis pertanyaan..." autocomplete="off" maxlength="500" required>
      <button type="submit" id="chat-send-btn" aria-label="Kirim">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </div>
</div>
